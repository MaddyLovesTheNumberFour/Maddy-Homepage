<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Novo Usuário</title>

</head>

<body>

<form action="" method="post">



<fieldset id="Cadastro">

<legend> Cadastro de Novo Usuário </legend>

<legend> <a href="../../index.html"> Voltar </a> </legend>

<fieldset id="Informações Pessoais">

<legend>Informações Pessoais</legend>

<legend> Nome Completo: </legend>

<input type="text" name="nome" id="nome">

<br> <br>

<legend>Data de Nascimento: </legend>


<input type="date" name=" Data de Nascimento " id=" Data de Nascimento ">

<br> <br>

<span> Gênero </span>



<input type="radio" name="Gênero" id="masculino">

<label for="masculino">Masculino</label>


<input type="radio" name="Gênero" id="feminino">


<label for="radio">Feminino</label>


<input type="radio" name="Gênero" id="não_binário">

<label for="não_binário"> Não Binário </label>


<input type="radio" name="Gênero" id="outro_gênero">

<label for="outro_gênero"> Outro Gênero </label>



<br> <br>

<label for="Cidade"> Selecione a sua Cidade: </label>    

<select name="Cidade" id="Cidade">

    <option value="araguatins"> Araguatins </option>

    <option value="palmas"> Palmas </option>

    <option value="gurupi"> Gurupi </option>

    <option value="porto nacional"> Porto nacional </option>

    <option value="paraíso do tocantins"> Paraíso do Tocantins </option>

    <option value="colinas do tocantins"> Colinas do tocantins </option>

</select>

</fieldset>

<br> <br>

<fieldset id="Interesses Pessoais">

<legend> Interesses Pessoais </legend>

Áreas de interesse  (Selecione até 4):

<br> <br>

Desenvolvimento Web

<input type="checkbox" name="Desenvolvimento Web" id="Desenvolvimento Web">

<br>  <br>

Desenvolvimento de Games 

<input type="checkbox" name="Desenvolvimento de Games" id="Desenvolvimento de Games">

<br> <br>

Inteligência Artificial

<input type="checkbox" name="Inteligência Artificial" id="Inteligência Artificial">

<br> <br>

Infraestrutura e Redes

<input type="checkbox" name="Infraestrutura e Redes" id="Infraestrutura e Redes">

<br> <br>

<legend> Email Acadêmico: </legend>

<input type="email" name="Email Acadêmico" id="Email Acadêmico">

<br><br>

<legend> Senha: </legend>

<input type="password" name="Senha" id="Senha">

<br> <br>

<legend> Biografia: </legend>

<textarea name="Biografia" id="Biografia" cols="30" rows="6" placeholder=""> Conte um pouco sobre você! </textarea>

</fieldset>

<br> <br>

<input type="submit" value="Finalizar Cadastro"> 

<input type="reset" value="Limpar Formulário">

</body>

</form>

</html>
